<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remit 原型图 · 22 屏</title>
<style>
  :root { --paper:#FFFFFF; --page:#FAFAF8; --line:#E7E4DD; --ink:#1A1A18; --ink-2:#57544D; --ink-3:#74716A; --mark:#2C5282;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--page); color:var(--ink); font-family:var(--font); font-size:13px; line-height:1.5; }
  header { padding:40px 48px 8px; }
  h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:-.015em; }
  header p { margin:6px 0 0; color:var(--ink-3); font-size:12px; }
  nav { padding:16px 48px 0; display:flex; flex-wrap:wrap; gap:6px; }
  nav a { color:var(--ink-2); text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-size:12px; background:var(--paper); }
  nav a:hover { color:var(--ink); border-color:var(--ink-3); }
  main { padding:24px 48px 80px; display:grid; gap:28px; }
  figure { margin:0; }
  figcaption { display:flex; align-items:baseline; gap:10px; margin-bottom:8px; }
  figcaption b { font-weight:500; font-size:13px; }
  figcaption span { color:var(--ink-3); font-size:12px; }
  figcaption code { margin-left:auto; color:var(--ink-3); font-size:11px; font-family:ui-monospace,Menlo,monospace; }
  img { display:block; width:100%; height:auto; border:1px solid var(--line); border-radius:8px; background:var(--paper);
        box-shadow:0 1px 2px rgba(20,18,12,.06); }
  @media (min-width:1100px) { main { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Remit 功能原型 · 40 屏</h1>
  <p>1440×900 @2x（2880×1800 PNG）· 纸面外观为主，一屏墨色 · 由 index.html 按深链接渲染，带真实指针状态，可复现</p>
</header>
<nav>
  <a href="#welcome">欢迎</a><a href="#today">今日</a><a href="#write">写</a><a href="#read">读</a>
  <a href="#recall">忆</a><a href="#stats">统计</a><a href="#settings">设置</a><a href="#misc">浮层</a><a href="#states">状态</a><a href="#fusion">融合</a><a href="#editing">编辑态</a><a href="#board">白板</a><a href="#recall2">忆·浏览</a>
</nav>
<main>
  <figure id="welcome"><figcaption><b>01 欢迎</b><span>打开 / 新建 / 导入，一条打不开的最近库</span><code>#/</code></figcaption><img src="01-welcome.png" alt="欢迎屏"></figure>
  <figure id="today"><figcaption><b>02 今日</b><span>预算 + 混合队列 + 读过还没摘</span><code>#/today</code></figcaption><img src="02-today.png" alt="今日屏"></figure>
  <figure id="write"><figcaption><b>03 笔记列表</b><span>搜索、筛选、排序、行内动作</span><code>#/write/notes</code></figcaption><img src="03-notes.png" alt="笔记列表"></figure>
  <figure><figcaption><b>04 文档 · 编辑</b><span>纸面 760 + 块沟槽 + 大纲面板</span><code>#/write/doc/n1</code></figcaption><img src="04-doc-edit.png" alt="文档编辑态"></figure>
  <figure><figcaption><b>05 文档 · 阅读</b><span>块编号与当前块高亮</span><code>#/write/doc/n1?mode=read</code></figcaption><img src="05-doc-read.png" alt="文档阅读态"></figure>
  <figure><figcaption><b>06 文档 · 分栏</b><span>左编辑右只读</span><code>#/write/doc/n1?mode=split</code></figcaption><img src="06-doc-split.png" alt="分栏"></figure>
  <figure id="read"><figcaption><b>07 阅读队列</b><span>每篇的位置与进度</span><code>#/read/queue</code></figcaption><img src="07-reading-queue.png" alt="阅读队列"></figure>
  <figure><figcaption><b>08 阅读会话</b><span>块推进、三档消化、E 摘录</span><code>#/read/queue · openReading()</code></figcaption><img src="08-reading-session.png" alt="阅读会话"></figure>
  <figure id="recall"><figcaption><b>09 复习队列</b><span>按笔记分组，范围入口</span><code>#/recall/queue</code></figcaption><img src="09-recall-queue.png" alt="复习队列"></figure>
  <figure><figcaption><b>10 复习会话</b><span>题面 / 分隔 / 答案 / 来源 / 四档</span><code>openReview()</code></figcaption><img src="10-recall-session.png" alt="复习会话"></figure>
  <figure><figcaption><b>11 复习总结</b><span>三个数字 + 插件一行</span><code>summary</code></figcaption><img src="11-recall-summary.png" alt="复习总结"></figure>
  <figure><figcaption><b>12 卡片表</b><span>排序、多选、状态与引用态</span><code>#/recall/cards</code></figcaption><img src="12-cards.png" alt="卡片表"></figure>
  <figure><figcaption><b>13 卡片详情</b><span>来源块 + 调度史时间线</span><code>openCardDetail()</code></figcaption><img src="13-card-detail.png" alt="卡片详情"></figure>
  <figure><figcaption><b>14 断链</b><span>丢失引用的重连</span><code>#/recall/relink</code></figcaption><img src="14-relink.png" alt="断链"></figure>
  <figure><figcaption><b>15 卡片类型</b><span>字段与模板是库资产</span><code>#/recall/types</code></figcaption><img src="15-types.png" alt="卡片类型"></figure>
  <figure><figcaption><b>16 复习范围</b><span>全库 / 笔记 / 标签</span><code>openScope()</code></figcaption><img src="16-scope.png" alt="复习范围"></figure>
  <figure id="stats"><figcaption><b>17 统计总览</b><span>一份调度史的三个切面</span><code>#/stats/overview</code></figcaption><img src="17-stats.png" alt="统计总览"></figure>
  <figure><figcaption><b>18 热力图</b><span>26 周日历格</span><code>#/stats/heatmap</code></figcaption><img src="18-heatmap.png" alt="热力图"></figure>
  <figure id="settings"><figcaption><b>19 设置 · 外观</b><span>主题、正文尺寸、纸面宽度</span><code>#/settings/appearance</code></figcaption><img src="19-settings-appearance.png" alt="设置外观"></figure>
  <figure><figcaption><b>20 设置 · 插件</b><span>能力标签就是授权范围</span><code>#/settings/plugins</code></figcaption><img src="20-settings-plugins.png" alt="设置插件"></figure>
  <figure id="misc"><figcaption><b>21 命令面板</b><span>⌘K：命令 + 笔记 + 卡片</span><code>openPalette()</code></figcaption><img src="21-palette.png" alt="命令面板"></figure>
  <figure><figcaption><b>22 今日 · 墨色</b><span>同一屏的第二套外观</span><code>#/today?theme=dark</code></figcaption><img src="22-today-dark.png" alt="今日墨色"></figure>
  <figure id="states"><figcaption><b>23 悬停</b><span>笔记行第二行：底色 + 行内动作显形</span><code>#/write/notes · hover</code></figcaption><img src="23-hover.png" alt="列表行的悬停态"></figure>
  <figure><figcaption><b>24 选中</b><span>卡片表选中两行：勾选、行底色、底部计数</span><code>#/recall/cards · 2 selected</code></figcaption><img src="24-selected.png" alt="卡片表的多选态"></figure>
  <figure><figcaption><b>25 占比</b><span>统计 · 时间配比：读 58% / 忆 34% / 摘 8%</span><code>#ratio-7d 局部</code></figcaption><img src="25-ratio.png" alt="时间配比条"></figure>
  <figure><figcaption><b>26 空态</b><span>把阅读队列读空之后</span><code>#/read/queue · empty</code></figcaption><img src="26-empty.png" alt="阅读队列空态"></figure>
  <figure id="fusion"><figcaption><b>27 摘录树</b><span>摘录可以再摘，形成层级</span><code>#/write/tree</code></figcaption><img src="27-excerpt-tree.png" alt="摘录树"></figure>
  <figure><figcaption><b>28 归档</b><span>读完的收起来，仍可搜索与引用</span><code>#/read/archive</code></figcaption><img src="28-archive.png" alt="归档页"></figure>
  <figure><figcaption><b>29 块检查器</b><span>一个块的三种角色：正文 / 卡片 / 摘录</span><code>沟槽徽章</code></figcaption><img src="29-block-inspector.png" alt="块检查器"></figure>
  <figure id="editing"><figcaption><b>30 插入菜单</b><span>`/` 打开的块类型菜单，末尾是插件槽</span><code>#/write/doc/n1</code></figcaption><img src="30-insert-menu.png" alt="插入菜单"></figure>
  <figure><figcaption><b>31 块菜单</b><span>移动、转换、摘录、制卡、三种角色、白板定位、插件槽、删除</span><code>沟槽 ⋮⋮</code></figcaption><img src="31-block-menu.png" alt="块菜单"></figure>
  <figure><figcaption><b>32 选区动作条</b><span>选中一句：挖空 / 制卡 / 摘录整段</span><code>选中文字</code></figcaption><img src="32-selection-bar.png" alt="选区动作条"></figure>
  <figure><figcaption><b>33 卡片编辑器</b><span>提示与答案，附类型与引用态</span><code>沟槽徽章 → 制卡</code></figcaption><img src="33-card-editor.png" alt="卡片编辑器"></figure>
  <figure><figcaption><b>34 导出</b><span>Markdown 目录 / .remitlib / 卡片 CSV</span><code>⋯ → 导出</code></figcaption><img src="34-export.png" alt="导出对话框"></figure>
  <figure><figcaption><b>35 导入向导</b><span>选来源 → 预览 → 完成</span><code>⋯ → 导入</code></figcaption><img src="35-import.png" alt="导入向导"></figure>
  <figure><figcaption><b>36 快捷键</b><span>三个动作共用一套键位</span><code>⌘/</code></figcaption><img src="36-keys.png" alt="快捷键"></figure>
  <figure id="board"><figcaption><b>37 白板</b><span>插件画布：5 个节点、4 条连线，点节点回那一段</span><code>#/plugin/board</code></figcaption><img src="37-whiteboard.png" alt="白板画布"></figure>
  <figure id="recall2"><figcaption><b>38 卡片浏览 · 搜索语法</b><span>`is:hard` 命中 10 张，token 行显示当前条件</span><code>#/recall/cards</code></figcaption><img src="38-cards-search.png" alt="卡片浏览的搜索语法"></figure>
  <figure><figcaption><b>39 调度预设</b><span>学习步、每日上限、败笔处理、断链行为</span><code>#/recall/presets</code></figcaption><img src="39-recall-presets.png" alt="调度预设"></figure>
  <figure><figcaption><b>40 历史</b><span>今天的时间线 + 评分分布 + 本周汇总</span><code>#/recall/history</code></figcaption><img src="40-recall-history.png" alt="复习历史"></figure>
</main>
</body>
</html>
